<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Network &amp; Systems Cheat Sheet</title>
<style>
:root{--bg:#f3f6fa;--surface:#fff;--ink:#0f1c2e;--mute:#5a6b82;--line:#d5dde8;--code-bg:#0f1c2e;--code:#ffd84d;--accent:#1d4ed8;--ok:#15803d;--warn:#c2410c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--surface:#131d30;--ink:#e6edf7;--mute:#93a3bb;--line:#26344d;--code-bg:#060b14;--code:#ffd84d;--accent:#6ea0ff;--ok:#4ade80;--warn:#fb923c}}
:root[data-theme="dark"]{--bg:#0b1220;--surface:#131d30;--ink:#e6edf7;--mute:#93a3bb;--line:#26344d;--code-bg:#060b14;--code:#ffd84d;--accent:#6ea0ff;--ok:#4ade80;--warn:#fb923c}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header,main{max-width:980px;margin:0 auto;padding:0 16px}
header{padding-top:20px}
h1{font-size:1.7rem;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 16px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:8px 0;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px;overflow-x:auto}
.tabs button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-size:.92rem;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#q{width:100%;margin-top:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
section{display:none;padding:16px 0 40px}
section.on{display:block}
h2{font-size:1.05rem;margin:22px 0 8px;color:var(--mute);font-weight:600}
.row{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
@media(min-width:640px){.row{grid-template-columns:minmax(0,18rem) minmax(0,1fr);align-items:center;gap:16px}}
.cmd{display:flex;align-items:center;gap:8px;background:var(--code-bg);border-radius:8px;padding:6px 6px 6px 10px;min-width:0}
code{font:.88rem ui-monospace,Menlo,Consolas,monospace;color:var(--code);overflow-x:auto;white-space:nowrap;flex:1}
.cp{flex:none;border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:6px;padding:4px 9px;font-size:.78rem;cursor:pointer}
.cp.done{background:var(--ok)}
.desc{margin:0}
.tag{font-size:.75rem;color:var(--mute)}
.step{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;padding:10px 12px}
.step h3{margin:0 0 6px;font-size:.98rem}
pre{margin:0;background:var(--code-bg);color:var(--code);border-radius:8px;padding:10px;overflow-x:auto;font:.85rem/1.5 ui-monospace,Menlo,Consolas,monospace}
.note{border-left:4px solid var(--accent);background:var(--surface);padding:10px 12px;border-radius:0 10px 10px 0;margin:12px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;font:inherit;font-size:.88rem;cursor:pointer}
.topo{display:flex;align-items:center;gap:4px;overflow-x:auto;padding:12px 0}
.node{flex:none;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:104px;font-size:.85rem}
.node b{display:block}
.tun{flex:1 0 110px;text-align:center;font-size:.8rem;color:var(--accent);border-top:3px dashed var(--accent);padding-top:4px;min-width:110px}
.grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.empty{color:var(--mute);padding:20px 0}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:10px}
td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:.92rem}
.hl{outline:2px solid var(--accent)}
.row.warn{border-left:4px solid var(--warn)}
</style>
</head>
<body>
<header>
<h1>Network &amp; Systems Cheat Sheet</h1>
<p class="sub">Linux, Windows, a Cisco switch setup and an IPsec VPN overview in one page. Tap a command to copy it.</p>
</header>
<div class="bar"><div style="max-width:980px;margin:0 auto;padding:0 16px">
<div class="tabs" role="tablist" id="tabs"></div>
<input id="q" type="search" placeholder="Filter (for example: dns, firewall, permissions)" aria-label="Filter commands">
</div></div>
<main>
<section id="linux"></section>
<section id="win"></section>
<section id="cisco"></section>
<section id="vpn"></section>
</main>
<script>
const LIN=`## Network · Interfaces & IP
ip addr :: Show IP addresses of network interfaces
ip link :: Show interfaces and their status (UP/DOWN)
ifconfig :: View or configure interfaces (legacy)
hostname -I :: Show the system’s IP addresses (all interfaces)
hostname :: Show the system hostname
## Network · Routing
ip route :: Display the routing table (routes, gateway)
route -n :: View or configure IP routes (legacy)
## Network · Connectivity
traceroute 8.8.8.8 :: Show the path packets take to a destination
mtr 8.8.8.8 :: Trace route with live statistics
## Network · Web & transfer
curl -I https://example.com :: Check HTTP/HTTPS connectivity and response headers
scp file.txt user@host: :: Copy files securely
## Network · Ports & connections
ss -tuln :: Show listening ports and active services (modern)
netstat -tulnp :: Active connections, listening ports and processes (legacy)
nmap 192.168.10.0/24 :: Scan a host or subnet to find open ports
arp -a :: Display the ARP table (IP to MAC mapping)
## Network · Firewall
firewall-cmd --list-all :: Show Firewalld rules and settings
ufw status :: Check UFW firewall status and rules (Ubuntu)
iptables -L :: List firewall rules
## Network · Troubleshooting
systemctl status NetworkManager :: Check the status of the network service
journalctl -u NetworkManager :: View network service logs
tcpdump -i eth0 :: Capture and analyze traffic on an interface
## 1. File & directory management
ls :: List files and directories
ls -al :: List all (including hidden) files
cd dir :: Change directory
pwd :: Print working directory
mkdir dir :: Create a directory
rmdir dir :: Remove an empty directory
rm file :: Delete a file
!rm -r dir :: Remove directory recursively
!rm -f file :: Force remove file
!rm -rf dir :: Remove directory recursively (force)
cp file1 file2 :: Copy file1 to file2
mv file1 file2 :: Rename or move file1 to file2
ln -s file link :: Create symbolic link
touch file :: Create an empty file / update timestamp
cat file :: Display file contents
more file :: View file (paged)
less file :: View file (more features)
head file :: Output first 10 lines
tail file :: Output last 10 lines
tail -f file :: Follow file as it grows (live view)
## 2. SSH
ssh user@host :: Connect to host as user
ssh -p port user@host :: Connect using port p
ssh -i key user@host :: Connect using private key
ssh -L p:host:port :: Local port forwarding
ssh -Nf user@host :: Run in background (no shell)
## 3. Networking
ping host :: Check connectivity
whois domain :: Get domain information
dig domain :: Get DNS records
nslookup host :: Resolve domain to IP
wget file :: Download a file from URL
wget -c url :: Resume an incomplete download
wget -r url :: Recursively download files from URL
## 4. System information
date :: Show current date and time
cal :: Show this month’s calendar
uptime :: Show system uptime
whoami :: Show the current logged-in user
uname -a :: Show kernel and system details
cat /proc/cpuinfo :: Show CPU information
cat /proc/meminfo :: Show memory (RAM) information
ps aux :: Show all running processes
df -h :: Show disk usage (human readable)
du -sh dir :: Show directory size
free -h :: Show memory usage (RAM, swap)
whereis app :: Find binary, source and man page
which app :: Show which executable will run
## 5. Searching
grep pattern file :: Search for pattern in a file
grep -r pattern dir :: Recursively search in a directory
command | grep pattern :: Filter command output by pattern
locate file :: Find a file (using database)
find / -name file :: Find a file by name from root
## 6. Process management
ps :: Show current processes
ps aux :: Show all processes (detailed)
kill pid :: Terminate process by PID
killall proc :: Kill all processes named proc
bg :: Resume a stopped job in background
fg :: Bring job to foreground
top :: Real-time process monitoring
htop :: Interactive process viewer (if installed)
## 7. File permissions
chmod octal file :: Change permission of file
4 :: read (r)
2 :: write (w)
1 :: execute (x)
chmod 755 file :: rwxr-xr-x (owner rwx, group r-x, other r-x)
chmod 644 file :: rw-r--r-- (owner rw-, group r--, other r--)
## 8. Compression
tar -cf file.tar files :: Create archive
tar -tf file.tar :: List archive contents
tar -xf file.tar :: Extract archive
tar -czf file.tar.gz files :: Create compressed archive (gzip)
tar -xzf file.tar.gz :: Extract compressed archive (gzip)
gzip file :: Compress a file (creates file.gz)
gzip -d file.gz :: Decompress a gzip file
## Tar flags
c :: create archive
t :: list contents
x :: extract
z :: gzip compression
j :: bzip2 compression
v :: verbose (show progress)
f :: file (specify archive name)
## 9. Shortcuts
Ctrl + C :: Interrupt current command
Ctrl + Z :: Stop current command (suspend)
Ctrl + D :: Log out (EOF)
Ctrl + R :: Search command history (reverse search)
Ctrl + U :: Erase from cursor to line start
Ctrl + K :: Erase from cursor to line end
Ctrl + L :: Clear the terminal screen
!! :: Repeat last command
exit :: Log out of current session`;
const WIN=`## Network · Configuration
ipconfig :: Show network configuration
## Network · Identity
hostname :: Display the computer name
getmac :: Show MAC addresses of network adapters
## Network · Shares & services
net use :: Connect to a shared resource
net share :: List shared resources
net start :: Show running services (or start one by name)
net stop SERVICE :: Stop a Windows service
## Network · Configuration
netsh :: Configure network settings
## System repair & health
sfc /scannow :: Scan and repair system files
DISM /Online /Cleanup-Image /RestoreHealth :: Repair the Windows image
chkdsk C: /f /r :: Check disk errors
systeminfo :: Display system information
!shutdown /r /f /t 0 :: Force restart now
powercfg /batteryreport :: Battery report
cleanmgr :: Disk Cleanup
## Network troubleshooting
ipconfig /all :: Show IP info
ipconfig /release :: Release IP
ipconfig /renew :: Renew IP
ipconfig /flushdns :: Clear DNS cache
netsh winsock reset :: Reset Winsock
netsh int ip reset :: Reset TCP/IP
ping 8.8.8.8 :: Test internet
tracert google.com :: Trace route
nslookup google.com :: DNS lookup
netstat -an :: List connections
arp -a :: Show ARP cache
netsh wlan show profile :: Show Wi-Fi profiles
## Disk & file management
diskmgmt.msc :: Disk Management
defrag C: :: Defragment disk
robocopy source destination /E :: Copy with structure
xcopy source destination /E /H /C /I :: Copy directories
!del /f /s /q C:\\Windows\\Temp\\*.* :: Delete temp files
!rmdir /s /q foldername :: Delete folder
attrib -h -r -s /s /d *.* :: Remove hidden attributes
fsutil dirty query C: :: Check dirty bit
!sdelete -p 3 filename :: Secure delete
## Boot, recovery & security
bcdedit /enum all :: Show boot entries
!bootrec /fixmbr :: Repair MBR
!bootrec /fixboot :: Repair boot sector
bootrec /scanos :: Scan installations
!bootrec /rebuildbcd :: Rebuild BCD
bcdboot C:\\Windows :: Recreate boot files
reagentc /enable :: Enable recovery environment
bcdedit /set {default} safeboot minimal :: Safe mode boot
bcdedit /deletevalue {default} safeboot :: Exit safe mode
wf.msc :: Windows Firewall settings
netsh advfirewall show allprofiles :: Show firewall profiles
!netsh advfirewall set allprofiles state on/off :: Toggle firewall
rstrui :: System Restore
explorer ms-settings:windowsdefender :: Defender settings
## Quick utilities
calc :: Calculator
notepad :: Notepad
mspaint :: Paint
osk :: On-screen keyboard
magnify :: Magnifier
snippingtool :: Snipping Tool
ncpa.cpl :: Network Connections
appwiz.cpl :: Programs and Features
inetcpl.cpl :: Internet Options
timedate.cpl :: Date & Time settings
## User & account management
net user :: List users
net user username password /add :: Add user
net localgroup administrators username /add :: Make admin
!net user username /delete :: Delete user
net user administrator /active:yes :: Enable admin
net user administrator /active:no :: Disable admin
control userpasswords2 :: Advanced account settings
whoami /groups :: Show user groups
## Services & system tools
msconfig :: System configuration
services.msc :: Manage services
taskmgr :: Task Manager
eventvwr :: Event Viewer
perfmon :: Performance Monitor
resmon :: Resource Monitor
gpedit.msc :: Group Policy Editor
compmgmt.msc :: Computer Management
sysdm.cpl :: System Properties
## Windows Update & activation
wuauclt /detectnow :: Check for updates
wuauclt /updatenow :: Start updates
usoclient startscan :: Scan for updates
usoclient startinstall :: Install updates
control update :: Open Windows Update
slmgr /ato :: Activate Windows
slmgr /xpr :: Check activation status
sc query wuauserv :: Check update service
## PowerShell admin tools
Get-EventLog -LogName System -Newest 20 :: Latest system logs
Get-Service | Where-Object {$_.Status -eq 'Running'} :: Running services
Restart-Service Spooler :: Restart print spooler
Stop-Process -Name notepad :: Stop process
Get-Process | Sort CPU -Descending | Select -First 10 :: Top CPU processes
Get-Disk :: Show disks
Get-NetAdapter :: Show network adapters
Test-Connection google.com :: Test connectivity
Get-WindowsFeature :: List Windows features
!Restart-Computer -Force :: Force restart
Get-HotFix :: Installed updates
Get-LocalUser :: Local users
Enable-LocalUser -Name Administrator :: Enable Administrator
Disable-LocalUser -Name Guest :: Disable Guest
Get-ComputerInfo :: System info`;
const STEPS=[
["Access the CLI (from console)","Switch> enable\nSwitch# configure terminal"],
["Set the hostname","Switch(config)# hostname S1"],
["Disable DNS lookup (recommended)","S1(config)# no ip domain-lookup"],
["Set the privileged EXEC password","S1(config)# enable secret C1sc0@123"],
["Configure the console password","S1(config)# line console 0\nS1(config-line)# password cisco123\nS1(config-line)# login\nS1(config-line)# exit"],
["Configure VTY (Telnet/SSH) password","S1(config)# line vty 0 4\nS1(config-line)# password cisco123\nS1(config-line)# login\nS1(config-line)# exit"],
["Configure management IP (SVI, VLAN 1)","S1(config)# interface vlan 1\nS1(config-if)# ip address 192.168.10.2 255.255.255.0\nS1(config-if)# no shutdown\nS1(config-if)# exit"],
["Save the configuration","S1(config)# end\nS1# copy running-config startup-config"]];
const VERIFY=[["show running-config","View current configuration"],["show ip interface brief","Check VLAN 1 IP status"],["show version","Display switch model and IOS"],["show vlan brief","View VLAN information"],["show interfaces status","Check port status"]];
const $=s=>document.querySelector(s);
const esc=t=>t.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function copy(text,btn){
  const ok=()=>{btn.textContent="Copied";btn.classList.add("done");setTimeout(()=>{btn.textContent=btn.dataset.l;btn.classList.remove("done")},1200)};
  try{navigator.clipboard.writeText(text).then(ok,fb)}catch(e){fb()}
  function fb(){try{const a=document.createElement("textarea");a.value=text;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove();ok()}catch(e){btn.textContent="Copy failed"}}
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-copy]");
  if(b){if(!b.dataset.l)b.dataset.l=b.textContent;copy(b.dataset.copy,b)}
});
const attr=t=>t.replace(/&/g,"&amp;").replace(/"/g,"&quot;");
function build(id,src,note){
  let h=note||"";
  src.split("\n").forEach(l=>{
    if(l.startsWith("## ")){h+=`<h2 class="grp">${esc(l.slice(3))}</h2>`;return}
    let [c,d]=l.split(" :: "),w=c.startsWith("!")&&c!=="!!";
    if(w)c=c.slice(1);
    h+=`<div class="row item${w?" warn":""}" data-t="${attr((c+" "+d).toLowerCase())}"><div class="cmd"><code>${esc(c)}</code><button class="cp" data-copy="${attr(c)}">Copy</button></div><p class="desc">${esc(d)}${w?" <b title='Use with care'>⚠</b>":""}</p></div>`;
  });
  $("#"+id).innerHTML=h+'<p class="empty" hidden>No commands match your filter.</p>';
}
build("linux",LIN,'<div class="note">Commands marked ⚠ delete data and cannot be undone. Double-check the path first.</div>');
build("win",WIN,'<div class="note">Run CMD or PowerShell as Administrator (Win + R, type <b>cmd</b>, then Ctrl + Shift + Enter). Commands marked ⚠ change or delete things: read them before you run them.</div>');
const all=STEPS.map(s=>s[1].split("\n").map(l=>l.replace(/^\S+[>#]\s?/,"")).join("\n")).join("\n");
$("#cisco").innerHTML=`<div class="note">Lab: Catalyst 2960 <b>S1</b> with PC-1 (192.168.10.10/24) and PC-2 (192.168.10.20/24). Use a console cable for first access. The passwords below are lab examples only: use strong, unique ones on real equipment.</div>
<div class="top"><h2 style="margin:0">Configuration steps</h2><button class="btn" data-copy="${attr(all)}">Copy all commands</button></div>
${STEPS.map((s,i)=>`<div class="step item" data-t="${attr((s[0]+" "+s[1]).toLowerCase())}"><h3>${i+1}. ${s[0]}</h3><pre>${esc(s[1])}</pre></div>`).join("")}
<h2>Verification</h2>
${VERIFY.map(v=>`<div class="row item" data-t="${attr(v.join(" ").toLowerCase())}"><div class="cmd"><code>${v[0]}</code><button class="cp" data-copy="${v[0]}">Copy</button></div><p class="desc">${v[1]}</p></div>`).join("")}
<h2>Expected result</h2><pre>S1# show ip interface brief
Interface IP-Address Status Protocol
Vlan1 192.168.10.2 up up</pre>
<p class="empty" hidden>No steps match your filter.</p>`;
$("#vpn").innerHTML=`<div class="note">A site-to-site IPsec VPN joins two office networks over the internet by encrypting traffic between their firewalls. Used for branch connectivity, multi-site organizations and secure data access.</div>
<h2>Topology</h2>
<div class="topo"><div class="node"><b>Head office</b>192.168.10.0/24<br>SW1 · FortiGate (HQ)</div><div class="tun">IPsec tunnel<br>encrypted traffic</div><div class="node"><b>Branch office</b>192.168.20.0/24<br>SW2 · FortiGate</div></div>
<h2>How it works</h2>
<p>Data leaves a LAN, the local firewall encrypts it with IPsec, it crosses the internet, the remote firewall decrypts it, and the data arrives on the other LAN.</p>
<h2>IPsec components</h2>
<table><tr><th>Part</th><th>Role</th></tr>
<tr><td><b>IKE</b></td><td>Establishes and manages the VPN tunnel</td></tr>
<tr><td><b>IPsec</b></td><td>Secures and encrypts the traffic</td></tr>
<tr><td><b>AH</b></td><td>Provides data integrity and authentication</td></tr>
<tr><td><b>ESP</b></td><td>Provides encryption, integrity and authentication</td></tr></table>
<h2>Benefits</h2>
<div class="grid"><div class="row">Secure (encrypted)</div><div class="row">Private connectivity</div><div class="row">Between two sites</div></div>`;
const T=[["linux","Linux"],["win","Windows"],["cisco","Cisco switch"],["vpn","IPsec VPN"]];
$("#tabs").innerHTML=T.map(([id,n],i)=>`<button role="tab" data-id="${id}" aria-selected="${i==0}">${n}</button>`).join("");
function show(id){
  document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id===id));
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.id===id));
  $("#q").style.display=id==="vpn"?"none":"";
  filter();
}
function filter(){
  const q=$("#q").value.trim().toLowerCase(),s=document.querySelector("section.on");
  if(!s||s.id==="vpn")return;
  let n=0;
  s.querySelectorAll(".item").forEach(i=>{const m=!q||i.dataset.t.includes(q);i.hidden=!m;if(m)n++});
  s.querySelectorAll(".grp").forEach(g=>{let el=g.nextElementSibling,any=false;while(el&&!el.classList.contains("grp")){if(el.classList.contains("item")&&!el.hidden)any=true;el=el.nextElementSibling}g.hidden=!any});
  const e=s.querySelector(".empty");if(e)e.hidden=n>0;
}
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b)show(b.dataset.id)});
$("#q").addEventListener("input",filter);
show("linux");
</script>
</body>
</html>
